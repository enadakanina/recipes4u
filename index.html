<!DOCTYPE.html>
<html>
<head>
	<title>Recipes 4U</title>
	<style>
		body {
			margin-left: 16.86%;
			margin-right: 16.86%;
		}
		.titulli {
			font-size: 580%;
			text-align: center;
			background: url(https://thumbs.dreamstime.com/b/collage-various-food-products-100490858.jpg);
			background-size: 100%;
			padding: 10px;
			float: center;
			color: white;
			text-shadow:
				-1px -1px 0 #000,
				1px -1px 0 #000,
				-1px 1px 0 #000,
				1px 1px 0 #000; 
			font-family: Courier New;
		}
		* {box-sizing: border-box;}
		.container {
			position: relative;
			width: 100%;
			max-width: 300px;
		}
		.image {
			display: block;
			margin-top: 20px;
		}
		.overlay {
			position: absolute; 
			bottom: 0; 
			background: rgb(0, 0, 0);
			background: rgba(0, 0, 0, 0.5); 
			color: #f1f1f1; 
			width: 100%;
			transition: .5s ease;
			opacity:0;
			color: white;
			font-size: 20px;
			font-family: Corbel Light;
			padding: 20px;
			text-align: center;
		}

		.container:hover .overlay {
			opacity: 1;
		}
		.teksti {
			font-family: Corbel Light;
			color: black;
			font-size: 215%;
			margin-top: 5%;
			padding-left: 7px;
			border-left-style: solid;
			border-left-color: #90bd96;
			border-left-width: 5px;
			text-align: justify;
			line-height: 1.6;
		}
		.row {
			display: flex;
			flex-wrap: wrap;
			padding: 0 4px;
		}
		.column {
			flex: 25%;
			max-width: 25%;
			padding: 0 4px;
		}

		.column img {
			margin-top: 8px;
			vertical-align: middle;
			width: 100%;
		}

		@media screen and (max-width: 800px) {
			.column {
				flex: 50%;
				max-width: 50%;
			}
		}

		@media screen and (max-width: 600px) {
			.column {
				flex: 100%;
				max-width: 100%;
			}
		}
		.fundi {
			font-family: Courier New;
			font-size: 140%;
			background-color: #90bd96;
			position: absolute;
			bottom: 10px;
			color: white;
			width: 66.28%;
			text-align: center;
			
		}
		.button {
			text-align: center;
			border-type: solid;
			border-color: green;
			color: white;
			background-color: #90bd96;
			font-family: Corbel light;
			width: 200px;
			height: 60px;
			font-size: 30px;
			margin-top: 80px;
			margin-left: 520px
		}
	</style>
</head>
<body>
	<div class="titulli">
	<p><strong>RECIPES 4U</strong></p>
	</div>
	<div class="teksti">
		<p>Here you'll find recipes of all kinds. From snacks to meal dishes one of them may become your next favourite food. 
		The diversity is major but all these recipes have one thing in common: <em>They're guaranteed to taste divine !</em>
	</div>
	<center style=" margin-top: 5%;">
	<a href="The recipe page.html"> <img src="Images\giphy.gif" style="width: 37.5%; height: 15%; object-fit: cover;"/></a>
	</center>
	<div class="fundi">
		<p>Contact us and add your own recipes: recipes4u@website.com</p>
	</div>
</body>
</html>
